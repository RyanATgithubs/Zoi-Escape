<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../assets/zoi-escape-favicon.ico">
    <link rel="stylesheet" href="../main/style.css">
    <link rel="stylesheet" href="play.css">
    <link rel="stylesheet" href="../../unity-build/TemplateData/unity-style.css">
    <link rel="stylesheet" href="leaderboard_ToRefactor.css">
    <title>Zoi: Escape</title>
</head>
<body>
    <script src="leaderboard.js" defer></script>
    <nav>
        <a href="../../index.html">Home</a>
        <ul>
            <li><a href="../story/story.html">Story</a></li>
            <li><a href="../char-info/char-info.html">Character Information</a></li>
            <li><a href="play.html">Play</a></li>
            <li><a href="../about/abt-dev.html">About the Developer</a></li>
        </ul>
    </nav>

    <section>
        <h1>Play</h1>
        
        <div class="main">
            <div class="leaderboard">
                <div class="leaderboard-header">
                    <div class="col rank">Rank</div>
                    <div class="col name">Player Name</div>
                    <div class="col time">Time</div>
                    <div class="col kills">Kills</div>
                    <div class="col kpm">KPM</div>
                    <button id="toggle-button">▼</button>
                </div>
                <ol class="leaderboard-body"></ol>
            </div>

            <div class="signin-window">
                <button id="google-signin-button">Google SignIn</button>
                <div id="auth-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10; justify-content: center; align-items: center; flex-direction: column; color: white; font-family: sans-serif;">
                    <div style="font-size: 24px; margin-bottom: 20px;">Logging you in...</div>
                    <div class="loader"></div> <button onclick="CancelSignin()" style="margin-top: 20px; padding: 10px 20px; cursor: pointer;">Cancel</button>
                </div>
            </div>

            <div id="unity-container">
            </div>

        </div>
    </section>

    <script src="play.js" defer></script> 
</body>
</html>
